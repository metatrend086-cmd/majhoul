<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1A130E">
<title>شكراً! الطلب ديالك وصلنا | سيليا أوازيس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Reem+Kufi:wght@500;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#120D09;font-family:'Almarai',Tahoma,sans-serif;color:#F4ECDD;line-height:1.8}
.page{max-width:480px;min-height:100vh;margin:0 auto;background:#1A130E;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{padding:16px;text-align:center;border-bottom:1px solid #3A2C21;font-family:'Reem Kufi','Almarai',sans-serif;font-size:22px;font-weight:700;color:#E7C27A}
main{flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:36px 26px;text-align:center}
.check{width:88px;height:88px;border-radius:50%;background:#2A1F17;color:#E7C27A;display:grid;place-items:center}
.check svg{width:46px;height:46px}
h1{margin:0;font-family:'Reem Kufi','Almarai',sans-serif;font-size:30px;line-height:1.4}
p{margin:0;font-size:17px;color:#C8B8A4}
.phone{display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:14px;background:#2A1F17;color:#E7C27A;font-weight:700}
.phone svg{width:20px;height:20px}
.recap{width:100%;padding:16px;border:1px solid #3A2C21;border-radius:14px;font-size:15px;color:#F4ECDD;display:none}
.recap.show{display:block}
.recap span{display:block;color:#C8B8A4;font-size:13px}
a{color:#E7C27A;font-weight:700}
:focus-visible{outline:3px solid #E7C27A;outline-offset:2px}
footer{padding:20px 20px 28px;text-align:center}
</style>
</head>
<body>
<div class="page">
  <header>سيليا أوازيس</header>
  <main>
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg></div>
    <h1>شكراً! الطلب ديالك وصلنا</h1>
    <p>غادي نعيطو ليك قريب باش نأكدو الطلب ونعطيوك ثمن التوصيل للمدينة ديالك.</p>
    <div class="phone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>خلي التيليفون قريب منك</div>
    <div class="recap" id="recap"></div>
    <p style="font-size:14px">الدفع عند الاستلام</p>
  </main>
  <footer><a href="./">رجع للصفحة</a></footer>
</div>
<script src="config.js"></script>
<script src="track.js"></script>
<script>
(function () {
  var o = null;
  try { o = JSON.parse(sessionStorage.getItem('celia_order') || 'null'); } catch (e) {}
  if (!o) return;
  var r = document.getElementById('recap');
  r.textContent = o.quality + '، 2 كيلو × ' + o.qty + ' = ' + o.subtotal + ' درهم';
  var s = document.createElement('span'); s.textContent = '+ ثمن التوصيل، كنأكدوه معاك فالتيليفون';
  r.appendChild(s); r.classList.add('show');
  // Purchase كيتسجل مرة وحدة فقط، حتى إلا تعاود تحميل الصفحة
  if (!o.tracked) {
    window.celiaTrack('Purchase', { value: o.subtotal, content_name: o.quality });
    o.tracked = true;
    try { sessionStorage.setItem('celia_order', JSON.stringify(o)); } catch (e) {}
  }
})();
</script>
</body>
</html>
